[project]
name = "gpu-kernel-lab"
version = "0.1.0"
description = "Notes, kernels, tests and benchmarks for GPU programming"
requires-python = ">=3.10"
dependencies = ["torch", "triton"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "pandas", "matplotlib"]

# Not a distributable package: `pip install -e ".[dev]"` only installs dependencies.
[tool.setuptools]
packages = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
